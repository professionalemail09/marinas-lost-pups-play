<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384">
  <defs>
    <radialGradient id="bg" cx="48%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="22%" stop-color="#F08A2A"/>
      <stop offset="58%" stop-color="#1B4F3C"/>
      <stop offset="100%" stop-color="#07140E"/>
    </radialGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4FBF6"/>
      <stop offset="100%" stop-color="#7EAF90"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE7D6"/>
      <stop offset="100%" stop-color="#E2A888"/>
