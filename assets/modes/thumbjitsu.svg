    <ellipse cx="9" cy="4" rx="5" ry="4" fill="#C9892D"/>
    <ellipse cx="0" cy="10" rx="8" ry="6" fill="#C9892D"/>
    <ellipse cx="0" cy="12" rx="3.2" ry="2.2" fill="#14181F"/>
    <circle cx="-7" cy="0" r="2.1" fill="#F6E7C4"/>
