  <g fill="url(#skin2)" stroke="#2B3550" stroke-width="3" stroke-linejoin="round">
    <rect x="214" y="78" width="16" height="44" rx="8" transform="rotate(12 222 100)"/>
    <rect x="232" y="70" width="18" height="54" rx="9"/>
