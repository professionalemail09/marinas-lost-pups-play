  <g transform="translate(330 70) scale(1.51)">
    <path d="M-10 -8 L-22 -40 L2 -12 Z" fill="#9AA3B2"/>
    <path d="M10 -8 L22 -40 L-2 -12 Z" fill="#9AA3B2"/>
    <path d="M-7 -10 L-15 -30 L1 -12 Z" fill="#E4E7EE"/>
    <path d="M7 -10 L15 -30 L-1 -12 Z" fill="#E4E7EE"/>
    <ellipse cx="0" cy="2" rx="20" ry="17" fill="#F4F1EA" stroke="#2B3550" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="8" ry="6" fill="#F7F4EF"/>
    <ellipse cx="0" cy="12" rx="3.2" ry="2.2" fill="#14181F"/>
    <circle cx="-7" cy="0" r="2.2" fill="#2B3550"/>
    <circle cx="7" cy="0" r="2.2" fill="#2B3550"/>
