  </defs>
  <rect width="384" height="384" fill="url(#bg)"/>
  <ellipse cx="192" cy="70" rx="90" ry="28" fill="#FFE08A" opacity=".45"/>
  <ellipse cx="300" cy="120" rx="40" ry="12" fill="#FFFFFF" opacity=".28"/>
  <ellipse cx="192" cy="214" rx="168" ry="86" fill="#0C2418"/>
  <ellipse cx="192" cy="206" rx="158" ry="78" fill="url(#mat)"/>
  <ellipse cx="192" cy="206" rx="158" ry="78" fill="none" stroke="#10281C" stroke-width="7"/>
  <ellipse cx="192" cy="206" rx="48" ry="24" fill="none" stroke="#1B4F3C" stroke-width="4"/>

  <!-- feet, clear of the hands -->
